name: test

on:
  push:
    paths:
      - "career_agent_harness/**"
  pull_request:
    paths:
      - "career_agent_harness/**"

jobs:
  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: career_agent_harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test_harness.py

